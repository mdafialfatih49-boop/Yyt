name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract SUPERPOWER & ARMOR EVOLUTION
        run: unzip -q SUPERPOWER-ARMOR-EVOLUTION-Fabric-1.20.1-Source.zip -d superpower-armor-evolution

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build SUPERPOWER & ARMOR EVOLUTION
        run: gradle build
        working-directory: superpower-armor-evolution

      - uses: actions/upload-artifact@v4
        with:
          name: SUPERPOWER-ARMOR-EVOLUTION-Fabric-1.20.1
          path: superpower-armor-evolution/build/libs/*.jar
